[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voltwise"
version = "0.1.0"
description = "Deterministic energy-aware physical outcome verification for Alexa+ demos"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx2>=2.13,<3",
  "mcp>=2.3,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<10"]

[project.scripts]
voltwise-mcp = "app.mcp.server:main"
voltwise-mcp-http = "app.mcp.http:main"
voltwise-api = "app.api.app:run"
voltwise-deployment = "app.deployment:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --basetemp=.pytest_tmp"

